<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Test photo AI Demo Days</title>
<meta property="og:title" content="AI Demo Days"><meta property="og:description" content="Test d'aperçu"><meta property="og:type" content="website"><meta property="og:url" content="https://stevenlozach.github.io/ai-demo-days/test.html"><meta property="og:image" content="https://stevenlozach.github.io/ai-demo-days/test-photo.jpg">
<style>body{margin:0;padding:20px 16px 48px;background:#05112f;color:#fff;font:16px/1.45 system-ui,sans-serif}h1{margin:0 0 8px;font-size:24px}p{color:#d3def3;margin:0 0 20px}a,button,label.b{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:16px;border:0;border-radius:12px;background:#ffd60a;color:#05112f;font:600 16px/1.3 system-ui,sans-serif;text-align:left;text-decoration:none}#log{color:#ffd60a;font-weight:600;min-height:24px}input{position:absolute;opacity:0;width:1px;height:1px}</style></head>
<body><h1>Test photo + texte</h1><p>Touche chaque bouton, choisis LinkedIn si un menu s'ouvre, et note si la photo et « Test » sont dans le post. Précise iPhone ou Android.</p>
<p id="log" role="status"></p>
<button id="a">1. Menu de partage : photo + texte</button>
<button id="b">2. Menu de partage : photo seule (texte copié)</button>
<label class="b" for="c">3. Choisir ou prendre une photo, puis partager</label><input id="c" type="file" accept="image/*">
<a href="https://www.linkedin.com/feed/share?url=https%3A%2F%2Fstevenlozach.github.io%2Fai-demo-days%2Ftest.html&text=Test">4. Lien iPhone avec aperçu de page</a>
<a href="https://www.linkedin.com/shareArticle?mini=true&url=https%3A%2F%2Fstevenlozach.github.io%2Fai-demo-days%2Ftest.html&text=Test">5. Lien Android avec aperçu de page</a>
<script>
var log=document.getElementById('log'),photo=null;
fetch('test-photo.jpg').then(function(r){return r.blob()}).then(function(b){photo=new File([b],'ai-demo-days.jpg',{type:'image/jpeg'});log.textContent='Photo prête.'}).catch(function(e){log.textContent='Photo non chargée : '+e.name});
function go(data){if(!navigator.canShare||!navigator.canShare(data)){log.textContent='Partage de fichier refusé par ce navigateur.';return}navigator.share(data).then(function(){log.textContent='Partage terminé.'}).catch(function(e){log.textContent=e.name==='AbortError'?'Menu fermé.':'Erreur : '+e.name})}
function copy(){var t=document.createElement('textarea');t.value='Test';t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';document.body.appendChild(t);t.focus({preventScroll:true});t.select();t.setSelectionRange(0,4);document.execCommand('copy');document.body.removeChild(t)}
document.getElementById('a').onclick=function(){if(!photo){log.textContent='Photo pas encore prête.';return}go({files:[photo],text:'Test'})};
document.getElementById('b').onclick=function(){if(!photo){log.textContent='Photo pas encore prête.';return}copy();go({files:[photo]})};
document.getElementById('c').onchange=function(e){var f=e.target.files[0];if(f)go({files:[f],text:'Test'})};
</script></body></html>
